[project]
name = "polymarket-execution"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
live = ["py-clob-client>=0.34"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
